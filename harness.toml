[[hook]]
id = "env-drift"
summary = "Say at session start when a local env file holds edits a secret store has not received"
events = ["SessionStart"]
script = "hooks/env-drift.py"

[[hook]]
id = "worktree-sweep"
summary = "Start the sweep of merged and clean worktrees at the start and the end of a session, when branches.autoApply turns it on"
events = ["SessionStart", "SessionEnd"]
script = "hooks/worktree-sweep.py"

# Context

[[hook]]
id = "load-memory"
summary = "Inject the memory index once per session, keyed on the session id"
events = ["SessionStart", "PreToolUse"]
matcher = "*"
script = "hooks/load-memory.sh"
files = ["hooks/inject-memory.py"]

[[hook]]
id = "prompt-directives"
summary = "Turn prompt flags (-u, -e, -d) and an embedded /lw-goal-spec into added context"
events = ["UserPromptSubmit"]
script = "hooks/prompt-directives.py"

[[hook.fixture]]
prompt = "check the parser again -u"
expect = "context"
contains = "maximum amount of reasoning"

[[hook.fixture]]
prompt = "then run /lw-goal-spec docs/specs/x.md"
expect = "context"
contains = "lw-goal-spec skill"

[[hook.fixture]]
prompt = "a plain prompt"
expect = "silent"

# Spec pipeline

[[hook]]
id = "render-spec"
summary = "Render a changed spec to its HTML page on Write and Edit and at the end of a turn, and hold a turn whose reply links a missing page"
events = ["PostToolUse", "Stop"]
matcher = "Write|Edit|MultiEdit"
script = "hooks/render-spec.py"
timeout = 60

[[hook]]
id = "goal-spec"
summary = "Hold a turn open until the saved spec audit shows zero open rows (lw-goal-spec)"
events = ["Stop"]
script = "hooks/goal-spec.py"
timeout = 60

# Resource guards

[[hook]]
id = "local-run-guard"
summary = "Keep tests, lints and builds on the remote runner unless the user asks for a local run"
events = ["UserPromptSubmit", "PreToolUse"]
matcher = "Bash"
script = "hooks/local-run-guard.py"
default = "off"

[[hook.fixture]]
tool = "Bash"
command = "npx vitest run"
expect = "deny"
contains = "remote runner"

