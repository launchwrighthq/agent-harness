# The manifest of the agent-harness package: its hooks, rules, skills and git hooks.
# Paths are relative to this folder. `ah install` and `ah selftest` read it. docs/hooks.md gives
# the format and each hook.

# Git safety

[[hook]]
id = "workspace-guard"
summary = "Refuse git mutations of another session's checkout, stash, whole-tree staging and ref-only moves"
events = ["PreToolUse"]
matcher = "Bash"
script = "hooks/workspace-guard.py"

[[hook.fixture]]
tool = "Bash"
command = "git stash"
expect = "deny"
contains = "stash"

[[hook.fixture]]
tool = "Bash"
command = "git status"
expect = "silent"

[[hook.fixture]]
tool = "Bash"
command = "git config user.name"
expect = "silent"

[[hook.fixture]]
tool = "Bash"
command = "git config --unset-a user.name"
expect = "deny"
contains = "shared Git configuration"

[[hook.fixture]]
tool = "Bash"
command = "git -c Core.HooksPath=/tmp/lw-selftest commit -m x"
expect = "deny"
contains = "gitConfigAllow"

[[hook.fixture]]
tool = "Bash"
command = "git --config-env=core.hooksPath=HOME commit -m x"
expect = "deny"
contains = "--config-env"

[[hook.fixture]]
tool = "Bash"
command = "GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/tmp git commit -m x"
expect = "deny"
contains = "GIT_CONFIG"

[[hook.fixture]]
tool = "Bash"
command = 'G"IT_CONFIG_COUNT"=1 git status'
expect = "deny"
contains = "GIT_CONFIG"

[[hook.fixture]]
tool = "Bash"
command = "git -c include.path=/tmp/lw-selftest status"
expect = "deny"
contains = "gitConfigAllow"

[[hook.fixture]]
