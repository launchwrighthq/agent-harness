command = "bash -c 'uv run pytest -q'"
expect = "deny"
contains = "`pytest` runs on the remote runner"

[[hook]]
id = "scratch-cap"
summary = "Run a scratchpad probe in a cgroup with a memory and CPU cap"
events = ["PreToolUse"]
matcher = "Bash"
script = "hooks/scratch-cap.sh"
codex = false
default = "off"

# Comment budget

[[hook]]
id = "comment-budget"
summary = "Refuse a write that makes a comment block longer than its cap, report the budget of the written file, and hold a turn once for the findings of the changed files"
events = ["PreToolUse", "PostToolUse", "Stop"]
matcher = "Write|Edit|MultiEdit"
script = "hooks/comment-budget.py"
default = "off"

# Git hooks

[[githook]]
id = "push-to-checkout"
summary = "Land a push into the checkout that holds the branch, refusing over a peer's uncommitted file"
name = "push-to-checkout"
script = "githooks/push-to-checkout"

[[githook]]
id = "commit-msg-strip"
summary = "Take agent attribution trailers out of a commit message"
name = "commit-msg"
script = "githooks/commit-msg"
files = ["githooks/strip_commit_trailers.py"]

[[githook]]
id = "noreply-identity"
summary = "Rewrite the author and committer of a new commit to the noreply address"
name = "post-commit"
script = "githooks/post-commit"
default = "off"

# Rules

[[rule]]
id = "anti-slop"
summary = "Anti-slop: Simplified Technical English, banned words and patterns, no em dashes"
file = "rules/anti-slop.md"

[[rule]]
id = "git-workflow"
summary = "Git workflow: worktrees, landing, no stash"
file = "rules/git-workflow.md"

[[rule]]
id = "secrets"
summary = "Secrets: never read a credential file"
file = "rules/secrets.md"

[[rule]]
id = "spec-format"
summary = "Spec format and rendering"
file = "rules/spec-format.md"
paths = ["docs/specs/**", "docs/superpowers/plans/**"]

[[rule]]
id = "operator-report"
summary = "The report at the end of a task and the levels of done"
file = "rules/operator-report.md"

[[rule]]
id = "codex"
summary = "Codex: hooks, trust and the skill adapters"
file = "rules/codex.md"
paths = ["AGENTS.md", ".codex/**"]
agentsCovers = "every file"

[[rule]]
id = "instance-agnostic"
summary = "Instance-agnostic code: correct with two or more replicas"
file = "rules/instance-agnostic.md"

[[rule]]
id = "code-limits"
summary = "Code limits: one concern per file, small functions, layer boundaries, the comment budget and error handling"
file = "rules/code-limits.md"

[[rule]]
id = "core-principles"
summary = "Core principles: truth over optimism, verify before done, ask before an uncertain change"
file = "rules/core-principles.md"

